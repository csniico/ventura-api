info:
  title: Ventura API
  description: Ventura backend API.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT access token from /auth sign-in.
  schemas:
    CreateUserWithEmailDto:
      type: object
      properties:
        firstName:
          type: string
          example: Ada
        email:
          type: string
          example: ada@example.com
          format: email
      required:
        - firstName
        - email
    UserResponse:
      type: object
      properties:
        id:
          type: string
          example: 665f1b2c3d4e5f6a7b8c9d0e
        shortId:
          type: string
          example: aB3xY9kP
        firstName:
          type: string
          example: Ada
        lastName:
          type: object
          nullable: true
          example: Lovelace
        email:
          type: string
          example: ada@example.com
          format: email
        googleId:
          type: object
          nullable: true
        avatarUrl:
          type: object
          nullable: true
        avatarKey:
          type: object
          nullable: true
        businessId:
          type: object
          nullable: true
        isSystem:
          type: boolean
          example: false
        isActive:
          type: boolean
          example: true
        isEmailVerified:
          type: boolean
          example: false
        deleted:
          type: boolean
          example: false
        deletedAt:
          type: string
          nullable: true
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - shortId
        - firstName
        - email
        - isSystem
        - isActive
        - isEmailVerified
        - deleted
        - createdAt
        - updatedAt
    CreateUserWithGoogleDto:
      type: object
      properties:
        firstName:
          type: string
          example: Ada
        lastName:
          type: string
          example: Lovelace
        email:
          type: string
          example: ada@example.com
          format: email
        googleId:
          type: string
          example: google-oauth2|1234567890
        avatarUrl:
          type: string
          example: https://example.com/a.png
      required:
        - firstName
        - email
        - googleId
    GoogleLinkPreferencesDto:
      type: object
      properties:
        firstName:
          type: string
          enum:
            - keep
            - update
        lastName:
          type: string
          enum:
            - keep
            - update
        avatarUrl:
          type: string
          enum:
            - keep
            - update
    LinkGoogleAccountDto:
      type: object
      properties:
        email:
          type: string
          format: email
        googleId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
        preferences:
          $ref: "#/components/schemas/GoogleLinkPreferencesDto"
      required:
        - email
        - googleId
    CreatePasswordDto:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        newPassword:
          type: string
          minLength: 12
          example: sup3r-Secret!pw
      required:
        - userId
        - email
        - newPassword
    UpdatePasswordDto:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
          example: new-Passw0rd!yy
      required:
        - userId
        - email
        - oldPassword
        - newPassword
    HasPasswordResponse:
      type: object
      properties:
        hasPassword:
          type: boolean
          example: true
      required:
        - hasPassword
    UpdateProfileDto:
      type: object
      properties:
        firstName:
          type: string
          example: Ada
        lastName:
          type: object
          nullable: true
          example: Lovelace
        avatarUrl:
          type: object
          nullable: true
    UpdateFirstNameDto:
      type: object
      properties:
        firstName:
          type: string
          example: Ada
      required:
        - firstName
    UpdateLastNameDto:
      type: object
      properties:
        lastName:
          type: object
          nullable: true
          example: Lovelace
      required:
        - lastName
    RequestEmailChangeDto:
      type: object
      properties:
        newEmail:
          type: string
          example: new-address@example.com
          format: email
      required:
        - newEmail
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Logged out.
      required:
        - message
    ConfirmEmailChangeDto:
      type: object
      properties:
        code:
          type: string
          example: "123456"
          minLength: 6
          maxLength: 6
      required:
        - code
    UpdateAvatarDto:
      type: object
      properties:
        avatarUrl:
          type: object
          nullable: true
          example: https://example.com/a.png
        avatarKey:
          type: object
          nullable: true
          example: avatars/abc.png
      required:
        - avatarUrl
        - avatarKey
    SetBusinessIdDto:
      type: object
      properties:
        businessId:
          type: string
          example: 665f1b2c3d4e5f6a7b8c9d0e
      required:
        - businessId
    PresignUploadDto:
      type: object
      properties:
        contentType:
          type: string
          example: image/png
        filename:
          type: string
          example: avatar.png
        folder:
          type: string
          example: avatars
      required:
        - contentType
        - filename
    PresignedUploadResponse:
      type: object
      properties:
        fileKey:
          type: string
          example: avatars/abc123.png
        fileUrl:
          type: string
          example: https://cdn.example.com/avatars/abc123.png
        uploadUrl:
          type: string
          example: https://s3.example.com/bucket/avatars/abc123.png?X-Amz-...
      required:
        - fileKey
        - fileUrl
        - uploadUrl
    DeleteFileDto:
      type: object
      properties:
        fileKey:
          type: string
          example: avatars/abc123.png
      required:
        - fileKey
    DeleteFileResponse:
      type: object
      properties:
        fileKey:
          type: string
          example: avatars/abc123.png
      required:
        - fileKey
    CreateAdminDto:
      type: object
      properties:
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          example: ada@example.com
          format: email
      required:
        - name
        - email
    AdminResponse:
      type: object
      properties:
        id:
          type: string
          example: 665f1b2c3d4e5f6a7b8c9d0e
        shortId:
          type: string
          example: aB3xY9kP
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          example: ada@example.com
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - shortId
        - name
        - email
        - createdAt
        - updatedAt
    UpdateAdminProfileDto:
      type: object
      properties:
        name:
          type: string
          example: Ada Lovelace
    SignInPasswordDto:
      type: object
      properties:
        email:
          type: string
          example: ada@example.com
          format: email
        password:
          type: string
          example: S3curePassw0rd!
      required:
        - email
        - password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
      required:
        - accessToken
        - refreshToken
        - user
    SignInEmailDto:
      type: object
      properties:
        email:
          type: string
          example: ada@example.com
          format: email
      required:
        - email
    VerifyCodeDto:
      type: object
      properties:
        email:
          type: string
          example: ada@example.com
          format: email
        code:
          type: string
          example: "123456"
      required:
        - email
        - code
    SignInGoogleDto:
      type: object
      properties:
        idToken:
          type: string
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6...
      required:
        - idToken
    SignInAppleDto:
      type: object
      properties:
        identityToken:
          type: string
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6...
        rawNonce:
          type: string
        firstName:
          type: string
          example: Ada
        lastName:
          type: string
          example: Lovelace
      required:
        - identityToken
    BusinessResponse:
      type: object
      properties:
        id:
          type: string
          example: 665f1b2c3d4e5f6a7b8c9d0e
        shortId:
          type: string
          example: aB3xY9kP
        name:
          type: string
